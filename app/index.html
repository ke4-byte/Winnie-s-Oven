<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flavor Pairing Tool — Winnie’s Oven</title>
  <meta name="description" content="Enter a dessert flavor and get a personalized pairing with texture, mood, and serving ideas.">
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <header class="mx-auto flex max-w-6xl items-center justify-between px-5 py-6 lg:px-8"><a href="/" class="text-2xl font-bold" style="font-family:var(--font-heading)">Winnie’s <span style="color:var(--color-primary)">Oven.</span></a><a href="/compare" class="text-sm font-semibold hover:text-[var(--color-primary)]">Compare tools →</a></header>
  <main class="mx-auto max-w-6xl px-5 pb-20 pt-10 lg:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <p class="text-sm font-bold uppercase tracking-[.2em]" style="color:var(--color-primary)">The pairing kitchen</p>
      <h1 class="mt-3 text-5xl sm:text-6xl">What are you working with?</h1>
      <p class="mt-5 text-lg leading-8" style="color:var(--color-muted)">Start with one flavor. We’ll find the other half.</p>
    </div>
    <section class="mx-auto mt-12 max-w-3xl rounded-[var(--radius)] bg-[var(--color-surface)] p-5 shadow-xl sm:p-8">
      <form id="pairForm"><label for="flavor" class="text-sm font-bold">Your ingredient or dessert</label>
        <div class="mt-3 flex flex-col gap-3 sm:flex-row"><input id="flavor" required value="chocolate" placeholder="Try chocolate, lemon, cheesecake…" class="min-h-14 flex-1 rounded-[var(--radius)] border border-[#ead8cf] bg-[#fffaf5] px-5 outline-none transition focus:border-[var(--color-primary)] focus:ring-4 focus:ring-[#c85c4a22]"><button class="min-h-14 rounded-[var(--radius)] bg-[var(--color-primary)] px-7 font-bold text-[var(--color-primary-contrast)] transition hover:-translate-y-0.5 hover:shadow-lg">Find my duo →</button></div>
        <div class="mt-4 flex flex-wrap gap-2"><button type="button" data-flavor="strawberry" class="rounded-full border border-[#ead8cf] px-3 py-2 text-xs font-semibold hover:bg-[#f8ece5]">strawberry</button><button type="button" data-flavor="lemon" class="rounded-full border border-[#ead8cf] px-3 py-2 text-xs font-semibold hover:bg-[#f8ece5]">lemon</button><button type="button" data-flavor="coffee" class="rounded-full border border-[#ead8cf] px-3 py-2 text-xs font-semibold hover:bg-[#f8ece5]">coffee</button><button type="button" data-flavor="apple" class="rounded-full border border-[#ead8cf] px-3 py-2 text-xs font-semibold hover:bg-[#f8ece5]">apple</button></div>
      </form>
    </section>
    <section id="result" class="mx-auto mt-10 hidden max-w-3xl"></section>
    <div id="history" class="mx-auto mt-10 max-w-3xl"></div>
  </main>
  <script>
    const pairings = {
      chocolate: {
        match: 'raspberry',
        emoji: '🍫',
        score: 96,
        why: 'Dark, bittersweet chocolate loves raspberry’s bright acidity. The contrast keeps rich bites feeling light.',
        texture: 'silky + juicy',
        idea: 'Fold raspberry compote through a chocolate tart and finish with flaky salt.',
        tags: ['rich', 'bright', 'romantic']
      },
      strawberry: {
        match: 'basil',
        emoji: '🍓',
        score: 94,
        why: 'Sweet strawberry and fresh basil share a green, aromatic lift that makes both flavors taste more vivid.',
        texture: 'juicy + herbal',
        idea: 'Layer macerated strawberries with basil sugar and clouds of whipped mascarpone.',
        tags: ['fresh', 'garden', 'easy']
      },
      lemon: {
        match: 'pistachio',
        emoji: '🍋',
        score: 95,
        why: 'Pistachio brings a mellow, buttery depth that rounds lemon’s clean, zesty edge.',
        texture: 'crunchy + creamy',
        idea: 'Top a lemon olive-oil cake with pistachio praline and a spoonful of yogurt cream.',
        tags: ['sunny', 'nutty', 'elegant']
      },
      coffee: {
        match: 'orange',
        emoji: '☕',
        score: 91,
        why: 'Orange oils cut through coffee’s roast and add a fragrant, almost chocolatey brightness.',
        texture: 'aromatic + tender',
        idea: 'Add orange zest to a coffee tiramisu and finish with cocoa nibs.',
        tags: ['warm', 'citrusy', 'grown-up']
      },
      apple: {
        match: 'brown butter',
        emoji: '🍎',
        score: 97,
        why: 'Nutty brown butter amplifies baked apple’s cozy sweetness without competing with it.',
        texture: 'soft + crisp',
        idea: 'Serve warm cinnamon apples over brown-butter cake with a cool scoop of vanilla ice cream.',
        tags: ['cozy', 'autumnal', 'comfort']
      }
    };
    const fallback = {
      match: 'vanilla bean',
      emoji: '✨',
      score: 88,
      why: 'Vanilla’s gentle floral sweetness gives your starting point room to shine while adding a soft, rounded finish.',
      texture: 'smooth + delicate',
      idea: 'Try it as a cream, custard, or quick drizzle so the original flavor stays in focus.',
      tags: ['balanced', 'classic', 'versatile']
    };
    const form = document.querySelector('#pairForm'),
      input = document.querySelector('#flavor'),
      result = document.querySelector('#result');
    document.querySelectorAll('[data-flavor]').forEach(b => b.onclick = () => {
      input.value = b.dataset.flavor;
      form.requestSubmit()
    });

    function render(value) {
      const key = value.toLowerCase().trim();
      const data = pairings[key] || Object.entries(pairings).find(([k]) => key.includes(k))?.[1] || fallback;
      const label = value.trim() || 'your flavor';
      result.innerHTML = `<article class="fade-up overflow-hidden rounded-[var(--radius)] bg-[#3e2926] text-[#fffaf5] shadow-xl"><div class="p-7 sm:p-10"><div class="flex items-start justify-between gap-5"><div><p class="text-xs font-bold uppercase tracking-[.2em] text-[#f4b5a0]">Your dessert duo</p><h2 class="mt-3 text-4xl">${label} <span class="text-[#f4b5a0]">+</span> ${data.match}</h2></div><div class="text-5xl">${data.emoji}</div></div><div class="mt-8 grid gap-4 sm:grid-cols-3"><div class="rounded-2xl bg-white/10 p-4"><p class="text-xs uppercase tracking-widest text-[#e7c9bd]">Pairing score</p><p class="mt-2 text-3xl font-bold">${data.score}<small class="text-base">/100</small></p></div><div class="rounded-2xl bg-white/10 p-4"><p class="text-xs uppercase tracking-widest text-[#e7c9bd]">Texture</p><p class="mt-2 font-bold">${data.texture}</p></div><div class="rounded-2xl bg-white/10 p-4"><p class="text-xs uppercase tracking-widest text-[#e7c9bd]">Mood</p><p class="mt-2 font-bold">${data.tags[0]}</p></div></div><p class="mt-8 text-lg leading-8 text-[#f8e9e2]">${data.why}</p><div class="mt-6 rounded-2xl bg-[#fffaf5] p-5 text-[#3e2926]"><p class="text-xs font-bold uppercase tracking-widest" style="color:var(--color-primary)">Make it tonight</p><p class="mt-2 leading-7">${data.idea}</p></div></div></article>`;
      result.classList.remove('hidden');
      localStorage.setItem('duoLast', JSON.stringify({
        label,
        match: data.match
      }));
    }
    form.onsubmit = e => {
      e.preventDefault();
      render(input.value)
    };
    const last = JSON.parse(localStorage.getItem('duoLast') || 'null');
    if (last) document.querySelector('#history').innerHTML = `<p class="text-center text-sm" style="color:var(--color-muted)">Last explored: <b>${last.label} + ${last.match}</b></p>`;

  </script>
</body>

</html>
